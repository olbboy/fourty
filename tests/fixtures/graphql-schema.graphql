type Query {
  contacts(limit: Int, q: String, sort: String, status: String, companyId: String): [Contact!]!
  contact(id: ID!): Contact
  factSuggestions(entityType: String, entityId: ID, status: String, limit: Int): [RecordFact!]!
  companies(limit: Int, q: String, industry: String, sort: String): [Company!]!
  company(id: ID!): Company
  deals(limit: Int, q: String, stageId: String, pipelineId: String, companyId: String, contactId: String): [Deal!]!
  deal(id: ID!): Deal
  tasks(limit: Int, state: String, entityType: String, entityId: String, sort: String): [Task!]!
  task(id: ID!): Task
  assignees: [Assignee!]!
  notes(limit: Int, entityType: String, entityId: String): [Note!]!
  activities(limit: Int, entityType: String, entityId: String): [Activity!]!
  customObjects: [CustomObjectDef!]!
  records(object: String!, limit: Int, q: String, sort: String): [Record!]!
  record(object: String!, id: ID!): Record
  search(q: String!, limit: Int): SearchResult!
  dashboardStats: DashboardStats!
  reportStats: ReportStats!
  pipelines: [Pipeline!]!
  pipeline(id: ID!): Pipeline
  stages(pipelineId: String): [Stage!]!
}

