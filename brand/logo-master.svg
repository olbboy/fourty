    <path fill="#231F20" d="M942.5,223.8l-0.1-0.1c30.9-2,55.6-28,55.6-59.4v-8.5c0-30.8-23.6-56.3-53.7-59.2c-1.9-0.2-3.9-0.3-5.9-0.3 h-4.3H816.7V302h35.7V129.3h81.8h0c8.5,0,16.2,3.5,21.8,9.1c5.6,5.6,9.1,13.3,9.1,21.8s-3.5,16.2-9.1,21.8 c-5.6,5.6-13.3,9.1-21.8,9.1h-66l27.7,33l65.6,78.2h46.6L942.5,223.8z"/>
