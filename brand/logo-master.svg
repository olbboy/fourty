<!-- The Fourty logo — the vector master, and the only hand-maintained artwork
     in this repository. Everything else (the React component's geometry, the
     favicon, the PWA icon, the exported lockups) is generated from this file by
     scripts/build-brand-assets.ts. Edit here, run `npm run build:brand`.

     The two groups are what makes the lockups separable:
       #compact    the 40 monogram — the 4 and the orange O
       #lettering  URTY, which the full lockup adds to the right of it

     Transcribed verbatim from the supplied Illustrator export, so the shapes
     are the designer's own. Colours are inline rather than CSS classes so the
     file stands alone: #231F20 ink and #FB631A orange. Do not recolour. -->
